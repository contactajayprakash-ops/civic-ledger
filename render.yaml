services:
  - type: web
    name: civic-ledger
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: LLM_API_KEY
        sync: false
      - key: LLM_BASE_URL
        value: https://api.featherless.ai/v1
      - key: LLM_MODELS
        sync: false
      - key: FIRECRAWL_API_KEY
        sync: false
      - key: NEXT_PUBLIC_SITE_URL
        sync: false
